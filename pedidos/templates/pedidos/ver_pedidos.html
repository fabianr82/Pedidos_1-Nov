<h1>Pedidos Registrados</h1>
<table border="1">
    <thead>
        <tr>
            <th>Nro Pedido</th>
            <th>Cliente</th>
            <th>Estado</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody>
        {% for pedido in pedidos %}
        <tr>
            <td>{{ pedido.nro_pedido }}</td>
            <td>{{ pedido.cliente.nombre }} {{ pedido.cliente.apellido }}</td>
            <td>{{ pedido.estado }}</td>
            <td>${{ pedido.total_pedido }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
