{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Pedido</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <!-- 1. Primera Parte: Crear Pedido -->
    <h1>Crear Pedido</h1>
    <form id="pedido-form" method="post">
        {% csrf_token %}
        <label for="nro_pedido"><strong>Número de Pedido:</strong></label>
        <input type="text" id="nro_pedido" name="nro_pedido" value="{{ pedido.nro_pedido|default:'1' }}" readonly><br>

        <label for="fecha_pedido"><strong>Fecha del Pedido:</strong></label>
        <input type="date" id="fecha_pedido" name="fecha_pedido" value="{{ pedido.fecha_pedido|date:'Y-m-d'|default:'' }}" required><br>

        <label for="estado"><strong>Estado del Pedido:</strong></label>
        <select id="estado" name="estado" required>
            <option value="Solicitado" {% if pedido.estado == "Solicitado" %}selected{% endif %}>Solicitado</option>
            <option value="Confirmado" {% if pedido.estado == "Confirmado" %}selected{% endif %}>Confirmado</option>
            <option value="Enviado" {% if pedido.estado == "Enviado" %}selected{% endif %}>Enviado</option>
            <option value="Entregado" {% if pedido.estado == "Entregado" %}selected{% endif %}>Entregado</option>
        </select><br>

        <label for="cliente_id"><strong>Seleccione un Cliente:</strong></label>
        <select id="cliente_id" name="cliente_id" required>
            <option value="" disabled selected>Seleccione un cliente</option>
            {% for cliente in clientes %}
            <option value="{{ cliente.cliente_id }}">{{ cliente.nombre }} {{ cliente.apellido }}</option>
            {% endfor %}
        </select><br>

        <label for="total_pedido"><strong>Total del Pedido:</strong></label>
        <input type="text" id="total_pedido" name="total_pedido" value="{{ pedido.total_pedido|default:'0.00' }}" readonly><br><br>

        <!-- Botón Guardar Pedido -->
        <button type="submit" class="btn btn-primary" id="guardar-pedido">Guardar Pedido</button>
    </form>

    <hr>

    <!-- 2. Segunda Parte: Agregar Producto -->
    <h2>Agregar Producto al Pedido</h2>
    <form id="form-agregar-producto">
        {% csrf_token %}
        <label for="producto_id"><strong>Seleccione un Producto:</strong></label>
        <select id="producto_id" name="producto_id" required>
            <option value="" disabled selected>Seleccione un producto</option>
            {% for producto in productos %}
            <option value="{{ producto.item_producto }}">{{ producto.nombre }}</option>
            {% endfor %}
        </select>

        <label for="cantidad"><strong>Cantidad:</strong></label>
        <input type="number" id="cantidad" name="cantidad" value="1" min="1" required>

        <!-- Botón Agregar Producto -->
        <button type="button" class="btn btn-success" id="agregar-producto">Agregar Producto</button>
    </form>

    <hr>

    <!-- 3. Tercera Parte: Productos Solicitados -->
    <h2>Productos Solicitados</h2>
    <div id="productos-solicitados">
        {% include 'pedidos/_tabla_detalles.html' with detalles=detalles %}
    </div>

    <!-- Scripts -->
    <script src="{% static 'js/jquery-3.6.0.min.js' %}"></script>
    <script>
        // Script para agregar productos mediante AJAX
        $("#agregar-producto").on("click", function () {
            var formData = {
                csrfmiddlewaretoken: "{{ csrf_token }}",
                producto_id: $("#producto_id").val(),
                cantidad: $("#cantidad").val(),
                pedido_id: $("#nro_pedido").val()
            };

            $.ajax({
                type: "POST",
                url: "{% url 'agregar_producto' %}",
                data: formData,
                success: function (response) {
                    if (response.success) {
                        // Actualizar la tabla con los productos solicitados
                        $("#productos-solicitados").html(response.html);

                        // Actualizar el total del pedido
                        $("#total_pedido").val(response.total_pedido);

                        alert("Producto agregado correctamente.");
                    } else {
                        alert("Error: " + response.error);
                    }
                },
                error: function () {
                    alert("Error al agregar el producto.");
                }
            });
        });

        // Script para guardar pedido
        $("#pedido-form").on("submit", function (e) {
            e.preventDefault();
            $.ajax({
                type: "POST",
                url: "{% url 'guardar_pedido' %}",
                data: $(this).serialize(),
                success: function (response) {
                    if (response.success) {
                        alert("Pedido guardado correctamente.");
                        location.reload();
                    } else {
                        alert("Error: " + response.error);
                    }
                },
                error: function () {
                    alert("Error al guardar el pedido.");
                }
            });
        });
    </script>
</body>
</html>
